# CodeRabbit configuration.
#
# A Renovate bump is a tag and SHA moved together, and the publishing workflow
# builds the image on the pull request; a review would only restate the
# release link. Skipping is by author, so the pull request stays skipped
# after a hand-pushed fix. When a bump needed one, request the review with a
# "@coderabbitai review" comment on the pull request.
reviews:
  auto_review:
    ignore_usernames:
      - "renovate[bot]"
