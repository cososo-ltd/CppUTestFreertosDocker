name: Build and Push to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  host:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built into the runner's Docker first, so the smoke runs against the
      # image on every pull request; the push below rebuilds from the cache.
      - name: Build host image for the smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfile.host
          load: true
          tags: cpputest-freertos:smoke
          cache-from: type=gha,scope=host
          cache-to: type=gha,scope=host,mode=max

      - name: Smoke host image
        run: docker run --rm -v "$PWD:/smoke:ro" cpputest-freertos:smoke /smoke/smoke/host/smoke.sh /smoke/dockerfile.host

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cpputest-freertos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Push host image
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfile.host
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=host

  # Runs on pull requests too, so the cross image is smoked before anything is
  # published. Its FROM names the host image by tag, and on a pull request that
  # tag is not in the registry, so the host image is rebuilt here from the
  # cache into an OCI layout and handed to the cross build in its place.
  cross:
    needs: host
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute short SHA tag
        id: vars
        run: echo "short_sha=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Rebuild host image as the cross base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfile.host
          outputs: type=oci,dest=${{ runner.temp }}/host,tar=false
          tags: cpputest-freertos:base
          cache-from: type=gha,scope=host

      - name: Build cross image for the smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfile.cross
          load: true
          build-args: |
            BASE_TAG=${{ steps.vars.outputs.short_sha }}
          build-contexts: |
            ghcr.io/${{ github.repository_owner }}/cpputest-freertos:${{ steps.vars.outputs.short_sha }}=oci-layout://${{ runner.temp }}/host:base
          tags: cpputest-freertos-cross:smoke
          cache-from: type=gha,scope=cross
          cache-to: type=gha,scope=cross,mode=max

      - name: Smoke cross image
        run: docker run --rm -v "$PWD:/smoke:ro" cpputest-freertos-cross:smoke /smoke/smoke/cross/smoke.sh /smoke/dockerfile.cross

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cpputest-freertos-cross
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Push cross image
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfile.cross
          push: true
          build-args: |
            BASE_TAG=${{ steps.vars.outputs.short_sha }}
          build-contexts: |
            ghcr.io/${{ github.repository_owner }}/cpputest-freertos:${{ steps.vars.outputs.short_sha }}=oci-layout://${{ runner.temp }}/host:base
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cross

  # Tells solid-syslog both images are published, so its Image Bump workflow
  # opens the pull request that moves every reference onto the new digests and
  # runs CI on it. The token is minted from the release GitHub App for
  # solid-syslog, where the App is installed; this repository holds only the
  # App's ID and key.
  notify:
    needs: cross
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: cososo-ltd
          repositories: solid-syslog
          permission-contents: write

      - name: Send image-published to solid-syslog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/cososo-ltd/solid-syslog/dispatches \
            -f event_type=image-published \
            -f 'client_payload[images]=cpputest-freertos cpputest-freertos-cross' \
            -f "client_payload[tag]=sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
